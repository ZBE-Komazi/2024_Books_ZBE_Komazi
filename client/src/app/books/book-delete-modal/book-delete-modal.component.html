<div class="modal-header">
    <h4 class="modal-title">Delete Book</h4>
    <button type="button" class="close" aria-label="Close" (click)="bsModalRef.hide()" style="position: absolute; right: 1rem;">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <p>Are you sure you want to delete the book "{{ book?.title }}"?</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">No</button>
    <button type="button" class="btn btn-danger" (click)="deleteBook()">Yes</button>
  </div>
