<div class="modal-header">
    <h4 class="modal-title">Edit Book</h4>
    <button type="button" class="close" aria-label="Close" (click)="bsModalRef.hide()" style="position: absolute; right: 1rem;">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form (ngSubmit)="updateBook()" #bookForm="ngForm">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" [(ngModel)]="book.title" name="title" required>
      </div>
      <div class="mb-3">
        <label for="author" class="form-label">Author</label>
        <input type="text" class="form-control" id="author" [(ngModel)]="book.author" name="author" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" [(ngModel)]="book.description" name="description" rows="3" required></textarea>
      </div>
      <div class="mb-3 d-flex align-items-center">
        <label for="isRead" class="form-label me-2">Is Read</label>
        <input type="checkbox" id="isRead" [(ngModel)]="book.isRead" name="isRead" class="form-check-input" style="transform: scale(1.5);">
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
    </form>
  </div>
